<!DOCTYPE html>
<html xmlns:a="urn:schemas-microsoft-com:vml" xmlns:v="urn:schemas-microsoft-com:vml"
	xmlns:o="urn:schemas-microsoft-com:office:office" lang="en">

<!--%%[/* Yearbook B2B Email Template 4.2 - (July 2025) */ set @FrameworkVersion = 420 ]%%-->

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
	<meta name="x-apple-disable-message-reformatting">
	<meta name="color-scheme" content="light dark">
	<meta name="supported-color-schemes" content="light dark" />
	<title>Jostens Responsive Email</title>

	<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
<style>
/* Legacy PC Outlook CSS */
table, td {mso-table-lspace:0; mso-table-rspace:0;}
body, td, th, p, div, li, a, span {mso-line-height-rule: exactly;}
.button a {background: transparent !important;}
.mso-keepwhite { mso-style-textfill-type:gradient; mso-style-textfill-fill-gradientfill-stoplist:'0 \#FFFFFF 0 100000\,100000 \#FFFFFF 0 100000'; color:#000000 !important; }
.mso-keepblack { mso-style-textfill-type:gradient; mso-style-textfill-fill-gradientfill-stoplist:'0 \#000000 1 100000\,99000 \#000000 1 100000'; color:#ffffff !important; }
</style>
<![endif]-->

	<style>
		/* Custom Fonts */
		@font-face {
			font-family: 'Roboto';
			font-style: normal;
			font-weight: 100 900;
			font-display: swap;
			src: url(https://fonts.gstatic.com/s/roboto/v47/KFO7CnqEu92Fr1ME7kSn66aGLdTylUAMa3yUBHMdazQ.woff2) format('woff2');
		}

		@font-face {
			font-family: 'Roboto';
			font-style: italic;
			font-weight: 100 900;
			font-display: swap;
			src: url(https://fonts.gstatic.com/s/roboto/v47/KFO5CnqEu92Fr1Mu53ZEC9_Vu3r1gIhOszmkBnkaSTbQWg.woff2) format('woff2');
		}

		[style*="Roboto"] {
			font-family: 'Roboto', Helvetica, Arial, sans-serif !important;
		}

		/* Desktop Global CSS */
		table, th, td {
			border: 0;
			padding: 0;
			border-collapse: collapse !important;
			font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
		}

		/* Mobile Global CSS */
		@media screen and (max-width: 480px) {
			body, .wrap-bg { background-color: #ffffff !important; }
			.db { display: block !important; }
			.di { display: inline !important; }
			.dn { display: none !important; }
			.w100 { width: 100% !important; }
			.ha { height: auto !important; }
			.ma { margin: auto !important; }
			.vw100 { width: 100vw !important; }
			.vw90 { width: 90vw !important; }
			.vw80 { width: 80vw !important; }
			.vw70 { width: 70vw !important; }
			.vw60 { width: 60vw !important; }
			.tl { text-align: left !important; }
			.tc { text-align: center !important; }
			.logo { width: 20vw !important; }
			
			/* Mobile Font Sizes */
			.fs12 { font-size: 3.12vw !important; }
			.fs14 { font-size: 3.64vw !important; }
			.fs16 { font-size: 4.16vw !important; }
			.fs18 { font-size: 4.68vw !important; }
			.fs20 { font-size: 5.20vw !important; }
			.fs24 { font-size: 6.24vw !important; }
			.fs32 { font-size: 8.32vw !important; }
			.fs40 { font-size: 10.4vw !important; }

			/* Mobile Line Height */
			.lh16 { line-height: 4.16vw !important; }
			.lh18 { line-height: 4.68vw !important; }
			.lh20 { line-height: 5.20vw !important; }
			.lh22 { line-height: 5.72vw !important; }
			.lh24 { line-height: 6.24vw !important; }
			.lh32 { line-height: 8.32vw !important; }
			.lh38 { line-height: 9.88vw !important; }
			.lh56 { line-height: 14vw !important; }

			/* Mobile Padding */
			.pad0 { padding: 0 !important; }
			.padlr20 { padding: 0 5.2vw !important; }
			.padlr30 { padding: 0 7.8vw !important; }
			.padt20 { padding-top: 5.2vw !important; }
			.padb20 { padding-bottom: 5.2vw !important; }
			.padt30 { padding-top: 7.8vw !important; }
			.padb30 { padding-bottom: 7.8vw !important; }
			.padb50 { padding-bottom: 13.0vw !important; }
		}

		/* Dark Mode CSS */
		@media (prefers-color-scheme: dark) {
			.c-dark2 { color: #fff !important; }
			.wrap-dark { background-color: #2a2a2a !important; }
			.bg-dark { background-color: #1e1e1e !important; }
			.bg-dark3 { background-color: #252525 !important; }
			.dn-dark { display: none !important; }
			.di-dark { display: inline !important; }
			td.button.outline a { background-color: transparent !important; border: 1px solid #ffffff !important; }
		}
	</style>
</head>

<body class="wrap-bg wrap-dark" style="width:100% !important; height:100% !important; margin:0; padding:0; background-color:#dedede;">

	<!-- Start of Email Content -->
	<table role="presentation" class="wrap-bg wrap-dark" style="background-color:#dedede;" width="100%" align="center">
		<tr>
			<td class="pad0" align="center">

				<!-- Header -->
				<table role="presentation" class="vw100 bg-dark" style="background-color:#ffffff; width:768px; font-family:Helvetica, Arial, sans-serif;" align="center">
					<tr>
						<td class="padlr20" style="padding:20px 40px;" align="left">
							<!-- Jostens Logo -->
							<a href="https://www.jostens.com/" alias="Sec0_Header_JostensLogo" style="text-decoration:none;">
								<img src="https://cdn.jostens.com/apps/shop/images/email/2024/Common/Logo/jostenslogo_black_outlined.png" class="logo dn-dark" alt="Jostens" width="76" />
								<!--[if !mso]><!--><img src="https://cdn.jostens.com/apps/shop/images/email/2024/Common/Logo/jostenslogo_white.png" class="di-dark logo" style="display:none;" alt="Jostens" width="76" /><!--<![endif]-->
							</a>
						</td>
						<td class="dn" style="padding:20px 40px; font-family:Helvetica, Arial, sans-serif; font-size:10px; line-height:10px;" align="right">
							<a href="%%view_email_url%%" alias="Sec0_Header_ViewOnline" style="text-decoration:none;"><span class="c-dark" style="color:#444444;">VIEW ONLINE</span></a>
						</td>
					</tr>
				</table>

				<!-- Content Slot -->
				<table role="presentation" class="vw100" style="width:768px;" align="center">
					<tr>
						<td class="pad0" style="padding:0 0 20px;" align="center" data-type="slot" data-key="jostens-main-slot" data-label="Drop Blocks Here">
						</td>
					</tr>
				</table>

				<!-- Footer -->
				<table role="presentation" class="vw100 bg-dark" style="background-color:#ffffff; width:768px; font-family:Helvetica, Arial, sans-serif;" align="center">
					<tr>
						<td class="padlr20" style="padding:40px 40px 20px;" align="center">
							<!-- Jostens Logo -->
							<a href="https://www.jostens.com/" alias="Sec9_Footer_JostensLogo" style="text-decoration:none;">
								<img src="https://cdn.jostens.com/apps/shop/images/email/2024/Common/Logo/jostenslogo_black_outlined.png" class="logo dn-dark" alt="Jostens" width="76" />
								<!--[if !mso]><!--><img src="https://cdn.jostens.com/apps/shop/images/email/2024/Common/Logo/jostenslogo_white.png" class="di-dark logo" style="display:none;" alt="Jostens" width="76" /><!--<![endif]-->
							</a>
						</td>
					</tr>
					<tr>
						<td class="fs12 lh16" style="padding:0 40px 10px; font-family:Helvetica, Arial, sans-serif; font-size:12px; line-height:16px;" align="center">
							<span style="color:#000000;" class="c-dark2">%%Member_Busname%%<br>
							%%Member_Addr%%, %%Member_City%%, %%Member_State%% %%Member_PostalCode%% %%Member_Country%%</span>
						</td>
					</tr>
					<tr>
						<td class="fs12 lh16" style="padding:0 0 40px; font-family:Helvetica, Arial, sans-serif; font-size:12px; line-height:16px;" align="center">
							<span style="color:#000000;" class="c-dark2">©%%=Concat(Format(Now(),"yyyy"))=%%&nbsp;Jostens,&nbsp;Inc. All&nbsp;rights&nbsp;reserved.</span>
						</td>
					</tr>
				</table>

				<!-- Tracking -->
				<div style="display:none;">
					<custom name="opencounter" type="tracking"/>
				</div>

			</td>
		</tr>
	</table>

</body>
</html>
